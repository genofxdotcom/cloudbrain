name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# CLOUDFLARE BINDINGS & SECRETS CONFIGURATION
# ============================================================================
# CloudBrain uses TWO approaches for persistence:
#
# 1. BINDINGS (for KV & D1) - configured in Dashboard, persist across deploys
# 2. WORKER SECRETS (for IDs) - stored at worker level, persist across deploys
#
# ============================================================================
# SETUP STEPS
# ============================================================================
#
# STEP 1: Create resources in Cloudflare Dashboard
#   1. Go to Workers & Pages → Create KV Namespace "cloudbrain"
#   2. Go to Workers & Pages → Create D1 Database "cloudbrain"
#
# STEP 2: Bind resources to worker (Dashboard → CloudBrain → Settings → Bindings)
#   1. Add KV Namespace:
#      - Variable name: SECRETS
#      - Namespace: cloudbrain
#   2. Add D1 Database:
#      - Variable name: DB
#      - Database: cloudbrain
#   3. AI binding: (auto-available)
#
# STEP 3: Store IDs as Worker Secrets (persists with worker across all deploys!)
#
#   Get your IDs from Dashboard:
#   - KV ID: Go to KV → cloudbrain → Details → Copy Namespace ID
#   - D1 ID: Go to Databases → cloudbrain → Details → Copy Database ID
#
#   Store as secrets (these PERSIST FOREVER):
#
#   wrangler secret put KV_NAMESPACE_ID
#   wrangler secret put D1_DATABASE_ID
#
# These secrets are:
# ✅ Stored at the worker level (not in code/git)
# ✅ Persist across all deployments
# ✅ Persist across code changes
# ✅ Persist across npm updates
# ✅ Never exposed in logs or git
# ✅ Safe for open source projects
# ============================================================================

# Workers AI Binding (Auto-available in Cloudflare)
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
