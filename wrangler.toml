name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# CLOUDFLARE BINDINGS CONFIGURATION
# ============================================================================
# CloudBrain requires THREE bindings configured in Cloudflare Dashboard:
# 1. SECRETS (KV Namespace) - for storing channel credentials
# 2. DB (D1 Database) - for storing memories and conversation history
# 3. AI (Workers AI) - for Llama 2 model access
#
# Bindings are configured in Dashboard, NOT in wrangler.toml
# This ensures credentials/IDs are never exposed in code/git
#
# Setup in Cloudflare Dashboard:
# 1. Go to: Workers and Pages → CloudBrain → Settings → Bindings
# 2. Add KV Namespace binding:
#    - Variable name: SECRETS
#    - KV Namespace: cloudbrain
# 3. Add D1 Database binding:
#    - Variable name: DB
#    - D1 Database: cloudbrain
# 4. Add AI binding:
#    - Variable name: AI
#    - (Auto-available, no setup needed)
#
# See README.md for complete setup instructions
# ============================================================================

# Workers AI Binding (Auto-available in Cloudflare)
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
