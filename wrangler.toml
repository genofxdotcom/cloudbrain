name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# CLOUDFLARE BINDINGS CONFIGURATION
# ============================================================================
# CloudBrain requires THREE bindings to function:
# 1. SECRETS (KV Namespace) - for storing channel credentials
# 2. DB (D1 Database) - for storing memories and conversation history
# 3. AI (Workers AI) - for Llama 2 model access
#
# Bindings are specified by NAME (not secret IDs).
# This allows bindings to persist across all deployments.
# Users only need to create KV namespace and D1 database named 'cloudbrain'
# ============================================================================

# ============================================================================
# BINDING 1: KV Namespace (SECRETS)
# Stores all channel credentials (Telegram, Discord, WhatsApp tokens)
# ============================================================================
[[kv_namespaces]]
binding = "SECRETS"
id = "cloudbrain"

# ============================================================================
# BINDING 2: D1 Database (DB)
# Stores memories and conversation history
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "cloudbrain"
database_id = "cloudbrain"

# ============================================================================
# BINDING 3: Workers AI (AI)
# Provides access to Llama 2 model for natural language processing
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
