name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# ⚠️  CRITICAL: CLOUDFLARE BINDINGS CONFIGURATION ⚠️
# ============================================================================
# 🔴 MOST IMPORTANT: You MUST change the IDs below or your worker will FAIL!
#
# CloudBrain requires THREE bindings to function and PERSIST across deployments.
# Binding IDs are hardcoded below to survive all redeployments.
#
# ⚠️  REQUIRED SETUP (DO THIS FIRST):
# 1. Go to Cloudflare Dashboard → Workers & Pages → KV
# 2. Create a KV namespace named "cloudbrain" and get its ID
# 3. Replace the KV ID below: a241f85839474b30b9f1c73fb31f17a5
#
# 4. Go to Cloudflare Dashboard → Workers & Pages → Databases
# 5. Create a D1 database named "cloudbrain" and get its ID
# 6. Replace the D1 ID below: 6733f0a4-5412-4c1c-959d-3edfc621e020
#
# ⚠️  If you don't replace these IDs, deployment will FAIL!
# ⚠️  Each deployment must have YOUR OWN resource IDs from YOUR account!
# ============================================================================

# ============================================================================
# BINDING 1: KV Namespace (SECRETS)
# Stores all channel credentials (Telegram, Discord, WhatsApp tokens)
#
# ⚠️  CHANGE THIS: Replace a241f85839474b30b9f1c73fb31f17a5 with YOUR KV ID
# Get from: Cloudflare Dashboard → KV → cloudbrain → Copy Namespace ID
# ============================================================================
[[kv_namespaces]]
binding = "SECRETS"
id = "a241f85839474b30b9f1c73fb31f17a5"
preview_id = "a241f85839474b30b9f1c73fb31f17a5"

# ============================================================================
# BINDING 2: D1 Database (DB)
# Stores memories and conversation history
#
# ⚠️  CHANGE THIS: Replace 6733f0a4-5412-4c1c-959d-3edfc621e020 with YOUR D1 ID
# Get from: Cloudflare Dashboard → Databases → cloudbrain → Copy Database ID
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "cloudbrain"
database_id = "6733f0a4-5412-4c1c-959d-3edfc621e020"

# ============================================================================
# BINDING 3: Workers AI (AI)
# Provides access to Llama 2 model for natural language processing
# (This binding is auto-available in Cloudflare - no setup needed)
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
