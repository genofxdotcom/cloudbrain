name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# CLOUDFLARE BINDINGS CONFIGURATION
# ============================================================================
# CloudBrain requires THREE bindings to function:
# 1. SECRETS (KV Namespace) - Stores channel credentials
# 2. DB (D1 Database) - Stores memories and conversation history
# 3. AI (Workers AI) - Provides LLM access

# IMPORTANT: These bindings must be configured in Cloudflare Dashboard:
# Steps:
# 1. Go to Workers → cloudbrain → Settings → Bindings
# 2. Add KV Namespace:
#    - Variable name: SECRETS
#    - KV Namespace: cloudbrain
# 3. Add D1 Database:
#    - Variable name: DB
#    - Database: cloudbrain (or create new)
# 4. Add AI (Workers AI):
#    - Variable name: AI
#    - This is pre-configured and auto-available
# ============================================================================

# ============================================================================
# BINDING 1: KV Namespace (SECRETS)
# Stores all channel credentials (Telegram, Discord, WhatsApp tokens, etc.)
# NOTE: Replace YOUR_KV_NAMESPACE_ID with actual ID from Cloudflare Dashboard
# Get it from: Workers → cloudbrain → Settings → Bindings → KV Namespaces → cloudbrain
# ============================================================================
# [[kv_namespaces]]
# binding = "SECRETS"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_KV_PREVIEW_ID"

# ============================================================================
# BINDING 2: D1 Database (DB)
# Stores memories and conversation history
# NOTE: Replace YOUR_D1_DATABASE_ID with actual ID from Cloudflare Dashboard
# Get it from: Workers → cloudbrain → Settings → Bindings → D1 Databases → cloudbrain
# ============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "cloudbrain"
# database_id = "YOUR_D1_DATABASE_ID"

# ============================================================================
# BINDING 3: Workers AI (AI)
# Provides access to Llama 2 model for natural language processing
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
