name: Deploy CloudBrain to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/opt/cloudbrain"
            REPO="https://github.com/truehannan/cloudbrain.git"
            BRANCH="main"

            echo "=== CloudBrain Deployment Starting ==="

            # 1. Ensure system dependencies exist
            if ! command -v node &> /dev/null; then
              echo "ERROR: Node.js not installed. Install Node 18+ first."
              exit 1
            fi

            if ! command -v pm2 &> /dev/null; then
              echo "Installing pm2 globally..."
              npm install -g pm2
            fi

            if ! command -v npx &> /dev/null; then
              echo "ERROR: npm/npx not available."
              exit 1
            fi

            # 2. Stop running instance gracefully
            echo "=== Stopping current instance ==="
            pm2 stop cloudbrain 2>/dev/null || true
            pm2 delete cloudbrain 2>/dev/null || true

            # 3. Clone or pull repo
            if [ -d "$APP_DIR" ]; then
              echo "=== Pulling latest code ==="
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd
            else
              echo "=== First deploy - cloning repo ==="
              git clone --branch "$BRANCH" --single-branch "$REPO" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # 4. Install dependencies (clean install from lockfile)
            echo "=== Installing dependencies ==="
            if [ -f "package-lock.json" ]; then
              npm ci --production=false
            else
              npm install
            fi

            # 5. Build TypeScript
            echo "=== Building ==="
            npm run build

            # 6. Link CLI globally
            echo "=== Linking CLI ==="
            npm link 2>/dev/null || true

            # 7. Database migrations (idempotent - IF NOT EXISTS)
            echo "=== Running migrations ==="
            if [ -f "$APP_DIR/.env" ]; then
              source "$APP_DIR/.env"
              if [ -n "$DB_HOST" ] && [ -n "$DB_USER" ] && [ -n "$DB_NAME" ]; then
                mysql -h"$DB_HOST" -P"${DB_PORT:-3306}" -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < src/db/schema.sql 2>/dev/null || echo "Migration: tables already exist (OK)"
              else
                echo "Skipping migrations: .env incomplete"
              fi
            else
              echo "Skipping migrations: no .env file (run 'cloudbrain setup' first)"
            fi

            # 8. Start with pm2
            echo "=== Starting CloudBrain ==="
            cd "$APP_DIR"
            pm2 start dist/index.js \
              --name cloudbrain \
              --max-memory-restart 512M \
              --exp-backoff-restart-delay=1000 \
              --merge-logs \
              --log-date-format "YYYY-MM-DD HH:mm:ss"

            # 9. Save pm2 process list (survives reboot)
            pm2 save

            # 10. Health check
            echo "=== Health Check ==="
            sleep 3
            if pm2 show cloudbrain | grep -q "online"; then
              echo "=== DEPLOY SUCCESS: CloudBrain is running ==="
              pm2 show cloudbrain | grep -E "status|memory|uptime"
            else
              echo "=== DEPLOY FAILED: Process not running ==="
              pm2 logs cloudbrain --lines 20 --nostream
              exit 1
            fi

            echo "=== Deployment Complete ==="
