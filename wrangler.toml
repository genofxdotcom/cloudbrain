name = "cloudbrain"
main = "src/index.ts"
compatibility_date = "2024-01-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# CLOUDFLARE BINDINGS CONFIGURATION
# ============================================================================
# CloudBrain requires THREE bindings to function properly.
# These bindings PERSIST across all deployments when configured in Dashboard.
# ============================================================================

# ============================================================================
# BINDING 1: KV Namespace (SECRETS)
# Stores all channel credentials (Telegram, Discord, WhatsApp tokens)
# ============================================================================
[[kv_namespaces]]
binding = "SECRETS"
database_name = "cloudbrain"

# For local development with preview, uncomment:
# preview_database_name = "cloudbrain_preview"

# ============================================================================
# BINDING 2: D1 Database (DB)
# Stores memories and conversation history
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "cloudbrain"

# For local development with preview, uncomment:
# preview_database_name = "cloudbrain_preview"

# ============================================================================
# BINDING 3: Workers AI (AI)
# Provides access to Llama 2 model for natural language processing
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# OBSERVABILITY - Live logging and diagnostics
# ============================================================================
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
